<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mãos Solidárias</title>
    <!-- Ícone da aba vazio: evita o erro 404 do navegador procurando o favicon -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styles.css">
    <!-- type="module" permite dividir o JavaScript em vários arquivos -->
    <script type="module" src="../js/main.js"></script>
</head>
<body>

    <!-- Cabeçalho fixo: é o mesmo em todas as "páginas" da SPA -->
    <header class="cabecalho">

        <!-- Barra de acessibilidade (padrão do eMAG, usado em sites públicos brasileiros) -->
        <div class="barra-acessibilidade">
            <div class="container barra-acessibilidade-conteudo">
                <a href="#conteudo" class="link-pular">Ir para o conteúdo</a>
                <button type="button" id="botao-contraste" class="botao-contraste" aria-pressed="false">Alto contraste</button>
            </div>
        </div>

        <div class="container cabecalho-conteudo">
            <h1 class="logo">Instituto Mãos Solidárias</h1>
            <nav aria-label="Menu principal">
                <!-- Botão do menu no celular: aria-expanded informa se o menu está aberto -->
                <button type="button" class="menu-botao" aria-expanded="false" aria-controls="menu-principal">
                    <span class="icone-hamburguer" aria-hidden="true"></span>
                    <span class="visualmente-oculto">Menu</span>
                </button>

                <!-- Os links usam "#/" : o JavaScript lê o endereço e troca o conteúdo -->
                <ul class="menu" id="menu-principal">
                    <li><a href="#/inicio" data-rota="inicio">Início</a></li>
                    <li class="tem-submenu">
                        <a href="#/projetos" data-rota="projetos">Projetos</a>
                        <ul class="submenu">
                            <li><a href="#/projetos/projetos-sociais">Projetos sociais</a></li>
                            <li><a href="#/projetos/voluntariado">Voluntariado</a></li>
                            <li><a href="#/projetos/doacoes">Campanhas de doação</a></li>
                        </ul>
                    </li>
                    <li><a href="#/cadastro" data-rota="cadastro">Cadastro</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Área que o JavaScript preenche com o template da página atual -->
    <!-- tabindex="-1" permite que o link "Ir para o conteúdo" leve o foco até aqui -->
    <main id="conteudo" class="container" tabindex="-1">
        <noscript>
            <p class="alerta alerta-aviso">
                <strong>JavaScript desativado</strong>
                Este site precisa do JavaScript para funcionar. Ative-o nas configurações do navegador.
            </p>
        </noscript>
    </main>

    <!-- Rodapé fixo -->
    <footer class="rodape">
        <div class="container rodape-conteudo">
            <p>Contato: contato@maossolidarias.org | (41) 3333-4444</p>
            <p>&copy; 2026 Instituto Mãos Solidárias</p>
        </div>
    </footer>

</body>
</html>
