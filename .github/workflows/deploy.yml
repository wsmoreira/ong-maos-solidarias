# =========================================================
# CI/CD: publica o site no GitHub Pages automaticamente
# Toda vez que a branch main recebe um push (por exemplo, o merge
# de uma release), o GitHub instala as dependências, gera o build
# e publica a pasta dist/.
# =========================================================

name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

# Permissões mínimas para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys ao mesmo tempo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar build de produção
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências (versões exatas do package-lock.json)
        run: npm ci

      - name: Gerar o build (pasta dist)
        run: npm run build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
